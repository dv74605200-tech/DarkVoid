<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkVoid</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#050505;
    color:white;
    min-height:100vh;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,.92)),
    repeating-linear-gradient(
        45deg,
        #101010 0px,
        #101010 10px,
        #0b0b0b 10px,
        #0b0b0b 20px
    );
    z-index:-1;
}

.container{
    width:min(1100px,92%);
    margin:auto;
}

header{
    text-align:center;
    padding:30px 0;
}

.logo{
    font-size:clamp(45px,10vw,85px);
    font-weight:900;
    color:#55ff55;
    text-shadow:5px 5px #123512,0 0 25px #00ff44;
}

.subtitle{
    color:#aaa;
    margin-top:8px;
}

.hero{
    min-height:65vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.box{
    background:#0b0b0b;
    border:2px solid #333;
    padding:45px 25px;
    width:100%;
    box-shadow:0 0 35px #000;
}

h1{
    font-size:clamp(32px,7vw,60px);
}

.hero p{
    color:#aaa;
    margin:15px 0 30px;
}

.btn{
    padding:14px 28px;
    background:#174d1c;
    color:white;
    border:2px solid #55ff55;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.btn:hover{
    background:#55ff55;
    color:#000;
    transform:translateY(-2px);
}

.page{
    display:none;
    padding:40px 0 70px;
}

.page.active{
    display:block;
}

.title{
    text-align:center;
    color:#55ff55;
    font-size:42px;
    margin-bottom:35px;
    text-shadow:0 0 15px #00ff44;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:18px;
}

.card{
    background:#0c0c0c;
    border:2px solid #333;
    padding:28px 18px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    border-color:#55ff55;
    transform:translateY(-4px);
    box-shadow:0 0 20px #174d1c;
}

.card h2{
    color:#55ff55;
    margin-bottom:10px;
}

.card p{
    color:#999;
}

.price{
    color:#ffd83d;
    font-size:22px;
    font-weight:bold;
    margin:15px 0;
}

.not-sale{
    color:#ff5555;
    font-weight:bold;
    margin-top:15px;
}

.back{
    text-align:center;
    color:#55ff55;
    margin-top:30px;
    cursor:pointer;
}
